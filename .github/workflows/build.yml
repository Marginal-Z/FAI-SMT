name: build

# Builds every architecture Flutter can release for:
#   Windows  x64, arm64          (native runners; zip + setup.exe that upgrades in place)
#   Linux    x64, arm64          (native runners; tar.gz + .deb)
#   Android  armeabi-v7a, arm64-v8a, x86_64 (+ universal APK and AAB), release-signed
# Flutter is cloned at a fixed tag so x64 and arm64 hosts use the same SDK.

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Regression measures on generated BOMs, kept with every build.
      - name: Evaluation
        run: |
          {
            echo "# Evaluation $(git rev-parse --short HEAD)"
            echo; echo "## Reading (development generator)"; dart run tool/eval_read.dart 1000
            echo; echo "## Held-out generator"; dart run tool/eval_holdout.dart 400
          } > evaluation.md
          cat evaluation.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: evaluation
          path: evaluation.md

  linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-linux-${{ matrix.arch }}
      - name: Install Flutter
        run: |
          if [ ! -x "$RUNNER_TEMP/flutter/bin/flutter" ]; then
            git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package tar.gz and .deb
        run: |
          set -e
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          BUNDLE=build/linux/${{ matrix.arch }}/release/bundle
          NAME=SMT-FAI-$VERSION-linux-${{ matrix.arch }}
          mkdir -p dist
          tar -C "$(dirname $BUNDLE)" -czf dist/$NAME.tar.gz --transform "s,^bundle,SMT-FAI," bundle

          PKG=pkg
          mkdir -p $PKG/DEBIAN $PKG/opt/smt-fai $PKG/usr/bin $PKG/usr/share/applications $PKG/usr/share/icons/hicolor/256x256/apps
          cp -r $BUNDLE/. $PKG/opt/smt-fai/
          ln -s /opt/smt-fai/smt_fai $PKG/usr/bin/smt-fai
          cp assets/icon/app_icon.png $PKG/usr/share/icons/hicolor/256x256/apps/smt-fai.png
          cat > $PKG/usr/share/applications/smt-fai.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=SMT-FAI
          Comment=BOM vs BOM check with optional AI analysis
          Exec=/opt/smt-fai/smt_fai
          Icon=smt-fai
          Categories=Office;Engineering;
          Terminal=false
          EOF
          sed -i 's/^ *//' $PKG/usr/share/applications/smt-fai.desktop
          cat > $PKG/DEBIAN/control <<EOF
          Package: smt-fai
          Version: $VERSION
          Section: misc
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Depends: libgtk-3-0 | libgtk-3-0t64, libsecret-1-0
          Maintainer: Marginal-Z <289210392+Marginal-Z@users.noreply.github.com>
          Description: SMT-FAI
           Checks a single BOM against A-BOM + B-BOM part by part, with optional AI analysis.
          EOF
          sed -i 's/^          //' $PKG/DEBIAN/control
          dpkg-deb --build --root-owner-group $PKG dist/$NAME.deb
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: SMT-FAI-linux-${{ matrix.arch }}
          path: dist/*

  windows:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-windows-${{ matrix.arch }}
      - name: Install Flutter
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'flutter'
          if (-not (Test-Path (Join-Path $dir 'bin\flutter.bat'))) {
            git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git $dir
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dir 'bin')
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package zip
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $out = "build/windows/${{ matrix.arch }}/runner/Release"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$out/*" -DestinationPath "dist/SMT-FAI-$version-windows-${{ matrix.arch }}.zip"
      # Setup program with a fixed AppId: new versions upgrade the existing
      # install in place.
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Invoke-WebRequest -Uri 'https://jrsoftware.org/download.php/is.exe' -OutFile "$env:RUNNER_TEMP\is.exe"
            Start-Process -FilePath "$env:RUNNER_TEMP\is.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          }
          $src = (Resolve-Path "build/windows/${{ matrix.arch }}/runner/Release").Path
          & $iscc "/DAppVersion=$version" "/DAppArch=${{ matrix.arch }}" "/DSourceDir=$src" installer/windows/smt-fai.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Full offline installer with the local model, checked against its
          # SHA-256 before it is packed.
          $models = Join-Path $env:RUNNER_TEMP 'models'
          New-Item -ItemType Directory -Force -Path $models | Out-Null
          # The default matching model (lib/core/local_ai/model_store.dart).
          $file = Join-Path $models 'granite-embedding-278m-multilingual-Q4_K_M.gguf'
          Invoke-WebRequest -Uri 'https://huggingface.co/bartowski/granite-embedding-278m-multilingual-GGUF/resolve/main/granite-embedding-278m-multilingual-Q4_K_M.gguf' -OutFile $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '48985001cb8a2e05539e0c7b52064efbcae732ff08fd1fe391534d30cbd8d942') { throw "model hash mismatch: $hash" }
          & $iscc "/DAppVersion=$version" "/DAppArch=${{ matrix.arch }}" "/DSourceDir=$src" "/DModelsDir=$models" installer/windows/smt-fai.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: SMT-FAI-windows-${{ matrix.arch }}
          path: dist/*

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/jetbrains/kotlin/kotlin-compiler-embeddable
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock', 'tool/kotlin_compiler_checksums.json') }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Every release is signed with the same key (repository secrets), so
      # each version installs over the previous one.
      - name: Release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Android signing secrets are missing"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.p12" "$PASSWORD" "$ALIAS" "$PASSWORD" > android/key.properties
      # Flutter's included Gradle build uses 2.2.21; the app uses 2.4.0.
      # Keep their versions unchanged and let Gradle verify/reuse local bytes.
      - name: Prefetch verified Kotlin compiler artifacts
        run: python3 tool/prefetch_kotlin.py 2.2.21 2.4.0
      # One version code for every APK (no per-ABI offset), so moving between
      # the universal and per-ABI packages is never a downgrade.
      - name: Per-ABI APKs (armeabi-v7a, arm64-v8a, x86_64)
        run: bash tool/ci_retry.sh flutter build apk --release --split-per-abi -P force-version-code-ignoring-abi=true
      - name: Universal APK
        run: bash tool/ci_retry.sh flutter build apk --release
      - name: App bundle
        run: bash tool/ci_retry.sh flutter build appbundle --release
      - name: Check signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          EXPECTED=$(cat docs/signing/android-cert-sha256.txt)
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            DIGEST=$("$APKSIGNER" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            echo "$apk $DIGEST"
            if [ "$DIGEST" != "$EXPECTED" ]; then echo "::error::$apk is not signed with the release key"; exit 1; fi
          done
      - name: Collect
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp build/app/outputs/flutter-apk/app-$abi-release.apk dist/SMT-FAI-$VERSION-android-$abi.apk
          done
          cp build/app/outputs/flutter-apk/app-release.apk dist/SMT-FAI-$VERSION-android-universal.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/SMT-FAI-$VERSION-android.aab
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: SMT-FAI-android
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          # Packages only; the evaluation report stays with the build.
          pattern: SMT-FAI-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: docs/release-notes/${{ github.ref_name }}.md
